<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉克丝与艾希 · 像素动作检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1ed;color:#202530;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin:0 0 12px}p{color:#647080;line-height:1.7}header{margin-bottom:28px}.meta{display:flex;gap:10px;flex-wrap:wrap}.meta span{border:1px solid #d9dedb;border-radius:20px;padding:6px 12px;background:#fff}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:#fff;border:1px solid #d9dedb;border-radius:16px;padding:20px;overflow:hidden}h2{margin:0 0 16px;font-size:21px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;padding:8px 12px;border:1px solid #d3d9dc;border-radius:8px;background:#fff;color:#243247}button{cursor:pointer}button:hover{background:#edf3fb}.stage{display:flex;justify-content:center;background:repeating-conic-gradient(#dce0e4 0 25%,#e7eaed 0 50%) 0/24px 24px;border-radius:10px;overflow:hidden}canvas{width:100%;max-width:448px;aspect-ratio:56/64;image-rendering:pixelated}.readout{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#657281;margin:12px 0}.frame{width:100%}footer{border-top:1px solid #d9dedb;margin-top:30px;padding-top:16px;font-size:13px;color:#657281}@media(max-width:720px){.cards{grid-template-columns:1fr}main{margin-top:24px}}</style>
<main><header><h1>拉克丝与艾希 · 像素动作检查</h1><p>切换动作、暂停或拖动进度条，逐帧放大检查。图像按整数像素显示，不做平滑处理。</p><div class="meta"><span>2 张造型</span><span>17 张动作图</span><span>107 帧</span><span>8×8 统一网格</span></div></header><section class="cards" id="cards"></section><footer>预览速度仅用于检查，不代表游戏里的帧时长。游戏导入、战斗效果、HUD和卡片显示由Claude继续核对。资源与检查记录见HANDOFF.md和MANIFEST.json。此页面完全离线运行。</footer></main>
<script>
const counts={lux:{native:1,idle:6,run:8,attack:6,skill:7,skill2:7,ult:8,hit:2,dead:7},ashe:{native:1,idle:6,run:8,attack:6,q_attack:6,skill:6,skill2:7,ult:8,hit:2,dead:7}};
const labels={native:'造型',idle:'待机',run:'跑步',attack:'普攻',q_attack:'Q 连射',skill:'技能 1',skill2:'技能 2',ult:'大招',hit:'受击',dead:'死亡'};
for(const hero of ['lux','ashe']){
 const el=document.createElement('article');el.innerHTML=`<h2>${hero==='lux'?'拉克丝 · Lux':'艾希 · Ashe'} <small style="font-size:12px;color:#6c7886">${hero==='lux'?19:18}色</small></h2><div class="bar"><select aria-label="动作">${Object.keys(counts[hero]).map(a=>`<option value="${a}">${labels[a]}</option>`).join('')}</select><button class="play">播放</button><button class="prev" aria-label="上一帧">←</button><button class="next" aria-label="下一帧">→</button><select class="speed" aria-label="预览速度"><option value="220">慢速</option><option value="140" selected>中速</option><option value="80">快速</option></select></div><div class="stage"><canvas width="56" height="64"></canvas></div><div class="readout"><span class="file"></span><span class="position"></span></div><input class="frame" type="range" min="0" max="0" value="0" step="1" aria-label="当前帧">`;
 document.querySelector('#cards').append(el);
 const select=el.querySelector('select'),canvas=el.querySelector('canvas'),ctx=canvas.getContext('2d'),play=el.querySelector('.play'),range=el.querySelector('.frame'),speed=el.querySelector('.speed');
 let asset=new Image(),action='native',frame=0,playing=false,last=0,loaded=false;
 function draw(){ctx.clearRect(0,0,56,64);ctx.imageSmoothingEnabled=false;if(loaded){if(action==='native')ctx.drawImage(asset,288,384,448,512,0,0,56,64);else{const cols=asset.width/448;ctx.drawImage(asset,frame%cols*448,Math.floor(frame/cols)*512,448,512,0,0,56,64)}}range.value=frame;el.querySelector('.position').textContent=`${frame+1} / ${counts[hero][action]} 帧`;el.querySelector('.file').textContent=`${hero}_${action}.png`;play.textContent=playing?'暂停':'播放'}
 function load(){action=select.value;frame=0;playing=false;loaded=false;range.max=counts[hero][action]-1;asset=new Image();asset.onload=()=>{loaded=true;draw()};asset.onerror=()=>{el.querySelector('.file').textContent='图片读取失败：请保留PNG与此页面在同一文件夹'};asset.src=`${hero}_${action}.png`;draw()}
 function step(n){playing=false;frame=(frame+n+counts[hero][action])%counts[hero][action];draw()}
 select.onchange=load;play.onclick=()=>{playing=!playing;last=performance.now();draw()};el.querySelector('.prev').onclick=()=>step(-1);el.querySelector('.next').onclick=()=>step(1);range.oninput=()=>{playing=false;frame=Number(range.value);draw()};
 function tick(t){if(playing&&loaded&&t-last>=Number(speed.value)){last=t;frame=(frame+1)%counts[hero][action];draw()}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
}
</script></html>
